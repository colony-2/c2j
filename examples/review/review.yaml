id: document-review
version: "1.0.0"
desc: Ask questions about a stored document
input_schema:
  prompt:
    type: string
    required: true
sequence:
  - id: review
    op: input
    inputs:
      form:
        kind: review
        title: Review the design
        documents:
          design: '${{ context.artifacts["design.md"] }}'
        fields:
          - id: decision
            type: multiple_choice
            question: How should we proceed?
            required: true
            options:
              - {value: approve, label: Approve}
              - {value: revise, label: Request changes}
          - id: feedback
            type: paragraph_text
            question: What should change?
          - id: annotated_design
            type: file_upload
            question: Optionally attach an annotated design
outputs:
  answers: "${{ sequence.review.outputs.fields }}"
  receipt: "${{ sequence.review.outputs.receipt }}"
  artifact_refs: "${{ sequence.review.outputs.artifact_refs }}"
