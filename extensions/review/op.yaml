name: review-prepare
version: 1.0.0
description: Prepare a document review and its request-specific response schema
command: [python3, prepare.py]
input_schema:
  type: object
  required: [spec, documents, inbox]
  additionalProperties: false
  properties:
    inbox: {type: string, minLength: 1}
    documents:
      type: object
      additionalProperties: {type: object}
    spec:
      type: object
      required: [title, decisions]
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1}
        summary_markdown: {type: string}
        subject:
          type: object
          required: [id, version]
          additionalProperties: false
          properties:
            id: {type: string, minLength: 1}
            version: {type: string, minLength: 1}
        decisions:
          type: object
          minProperties: 1
          propertyNames: {minLength: 1}
          additionalProperties:
            type: object
            required: [label]
            additionalProperties: false
            properties:
              label: {type: string, minLength: 1}
              accepts_reviewed_content: {type: boolean}
              feedback_required: {type: boolean}
        document_options:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              title: {type: string}
              media_type: {enum: [text/markdown, text/plain]}
              annotation_policy: {enum: [none, criticmarkup]}
output_schema:
  type: object
  required: [form]
  additionalProperties: false
  properties:
    form:
      type: object
      required: [request, response_schema, presentation]
      properties:
        request: {type: object}
        response_schema: {type: object}
        presentation: {type: object}
