name: Test

on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test:
    strategy:
      matrix:
        include:
          # Linux AMD64
          - os: ubuntu-latest
          # Linux ARM64
          - os: ubuntu-22.04-arm
          # macOS Arm
          - os: macos-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure Git and Go for Private Modules
        run: |
          # 1. Tell Go not to use the public proxy/checksum DB for your org
          go env -w GOPRIVATE=github.com/colony-2/*
          
          # 2. Force Git to use your PAT for HTTPS requests to GitHub
          git config --global url."https://x-access-token:${{ secrets.READ_ALL_C2_REPOS }}@github.com/".insteadOf "https://github.com/"

      - name: Run tests (Unix)
        run: go test -v -tags=integration ./...
      - name: Check bundled skill discovery
        run: npx -y skills add . --list --full-depth

  default-recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout c2j
        uses: actions/checkout@v4
      - name: Checkout recipe compatibility fixtures
        uses: actions/checkout@v4
        with:
          repository: colony-2/recipes
          # Native declarations, including audited lifecycle and dependency coverage.
          ref: 29b096115f3f4a0c154e1d29dc8fe208ebf9585a
          path: test-repos/recipes
      - name: Checkout extension ops
        uses: actions/checkout@v4
        with:
          repository: colony-2/c2ops
          ref: ded76dfbd877d3d0749e509844ecdbc57197b572
          path: test-repos/c2ops
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Build CLI
        run: |
          go build -o "$RUNNER_TEMP/c2j" ./cmd/c2j
      - name: Pin extension selector main to the checked-out commit
        run: git -C test-repos/c2ops branch --force main HEAD
      - name: Run native recipe compatibility suites
        shell: bash
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.file://${{ github.workspace }}/test-repos/c2ops.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/colony-2/c2ops.git
          C2J_TEST_LOG_DIR: ${{ runner.temp }}/recipe-regression-logs
        run: |
          mkdir -p "$C2J_TEST_LOG_DIR"
          "$RUNNER_TEMP/c2j" test run --directory test-repos/recipes --case-timeout 5m \
            --out-dir "$C2J_TEST_LOG_DIR/results" 2>&1 | tee "$C2J_TEST_LOG_DIR/suites.log"
      - name: Retain failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-regression-logs
          path: ${{ runner.temp }}/recipe-regression-logs

  # Summary job that depends on all matrix jobs and recipe compatibility.
  test-summary:
    needs: [test, default-recipes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.default-recipes.result }}" != "success" ]; then
            echo "Test matrix: ${{ needs.test.result }}; default recipes: ${{ needs.default-recipes.result }}"
            exit 1
          fi
          echo "All test matrix jobs completed successfully"
