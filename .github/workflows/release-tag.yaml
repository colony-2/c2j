name: Release Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-tag-main
  cancel-in-progress: false

env:
  DEFAULT_BUMP: patch
  TAG_PREFIX: v
  RELEASE_BRANCHES: main
  CREATE_ANNOTATED_TAG: 'false'

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  create-tag:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: step-security/github-tag-action@v6.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ env.DEFAULT_BUMP }}
          tag_prefix: ${{ env.TAG_PREFIX }}
          release_branches: ${{ env.RELEASE_BRANCHES }}
          create_annotated_tag: ${{ env.CREATE_ANNOTATED_TAG }}
          fetch_all_tags: true
          commit_sha: ${{ github.sha }}
