            - actor:
                id: synthetic-human
                kind: human
              cell: root
              fields:
                context: diagnosis
              node_path: persistence/reply
              submission:
                after_all:
                    - stop
                expect_error:
                    kind: storage
                fault: claim
                id: faulted
                pending:
                    job: root
                    task:
                        attempt: 1
                        node_path: persistence/reply
