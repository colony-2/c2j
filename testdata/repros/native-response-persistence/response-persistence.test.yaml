                      phase: recovered
                      response: faulted
                      status: pending
                    - id: healthy-attempted
                      kind: response
                      phase: attempted
                      response: healthy
                jobs:
                    root:
                        root: true
                limits: {}
                outcomes:
                    root:
                        status: completed
                retain:
                    - id: frozen-generation
                      job: root
                      task:
                        attempt: 1
                        node_path: persistence/reply
                        occurrence: 1
                        task_type: input:generate_form
                    - id: original-input
                      job: root
                      part: input
                      task:
                        attempt: 1
                        node_path: persistence/original
                        occurrence: 1
                        task_type: command_execution:command_execution
                    - id: recovery-input
                      job: root
                      part: input
                      task:
                        attempt: 1
                        node_path: persistence/recovery
                        occurrence: 1
                        task_type: command_execution:command_execution
