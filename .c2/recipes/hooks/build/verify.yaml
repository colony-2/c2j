# Repository-wide checks; request text and target_directory never enter shell source.
# Bound live commands below, not durable states: recovery downtime must not expire
# a successful command whose enclosing state has not committed completion.
id: c2j-build-verify
version: "1.0.0"
desc: Validate the candidate on Linux arm64 with independently recorded CI checks.
execution:
  # Use the existing arm64 route for package preparation and offline tests.
  base: ubuntu-26.04-arm64
input_schema:
  api_version:
    type: string
    required: true
  request:
    type: string
    required: true
  target_directory:
    type: string
    required: true
  candidate:
    type: string
    required: true
  base:
    type: string
    required: true
  documents:
    type: artifact_map
    default_value: {}
  settings:
    type: artifact
    required: false
inputs:
  api_version: "${{ inputs.api_version }}"
  request: "${{ inputs.request }}"
  target_directory: "${{ inputs.target_directory }}"
  candidate: "${{ inputs.candidate }}"
  base: "${{ inputs.base }}"
  documents: "${{ inputs.documents }}"
state:
  initial: check_environment
  states:
    check_environment:
      id: check_environment
      op: command_execution
      inputs:
        shell: bash
        working_directory: "${{ context.environment.op.worktree_path }}"
        timeout: 2m
        continue_on_error: true
        capture_diagnostics: always
        env:
          GOPRIVATE: github.com/colony-2/*
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          OUTBOX: "${{ context.environment.op.outbox }}"
          API_VERSION: "${{ inputs.api_version }}"
          CANDIDATE: "${{ inputs.candidate }}"
          BASE: "${{ inputs.base }}"
        run: |
          set -eu
          exec > "$OUTBOX/environment.log" 2>&1
          printf 'Candidate: %s\nBase: %s\n' "$CANDIDATE" "$BASE"
          printf 'Local platform: '; uname -s -m || true
          printf 'Observed HEAD: '; git rev-parse HEAD || true
          bad=0
          if [ "$(uname -s -m)" != 'Linux aarch64' ]; then
            printf 'Native pnpm acceptance requires Linux aarch64.\n'; bad=1
          fi
          # Preserve the completed provenance gate for the selected architecture.
          if [ ! -r /proc/self/maps ]; then
            printf 'Missing process maps for native acceptance provenance.\n'; bad=1
          elif grep -E '/run/rosetta/rosetta|/qemu-x86_64|/qemu-aarch64' /proc/self/maps; then
            printf 'Native pnpm acceptance failed: emulated executor; native execution is required.\n'; bad=1
          fi
          if [ "$API_VERSION" != c2.build-hook/v1 ]; then
            printf 'Unsupported API version: %s\n' "$API_VERSION"; bad=1
          fi
          for tool in bash git make go node npm npx pnpm; do
            if ! command -v "$tool"; then printf 'Missing mandatory tool: %s\n' "$tool"; bad=1; fi
          done
          if command -v go >/dev/null; then
            go version || bad=1
            if [ "$(go env GOVERSION)" != go1.26.1 ]; then printf 'Requires Go 1.26.1\n'; bad=1; fi
          fi
          if command -v node >/dev/null; then
            node --version || bad=1
            case "$(node --version)" in v24.*) ;; *) printf 'Requires Node major 24\n'; bad=1 ;; esac
          fi
          if command -v npm >/dev/null; then npm --version || bad=1; fi
          if command -v npx >/dev/null; then npx --version || bad=1; fi
          if command -v pnpm >/dev/null; then pnpm --version || bad=1; fi
          bash --version | head -n 1 || true
          git --version || true
          make --version | head -n 1 || true
          if command -v docker >/dev/null; then
            docker version || printf 'Optional Docker daemon unavailable; tests may skip Docker coverage.\n'
          else
            printf 'Optional Docker absent; tests may skip Docker coverage.\n'
          fi
          printf 'Environment gate exit: %s\n' "$bad"
          exit "$bad"
      catch:
        - when: "failure.kind != 'cancellation'"
          continue:
            outputs:
              success: false
              exit_code: -1
              timed_out: "${{ failure.kind == 'timeout' }}"
              failure: "${{ failure }}"
              error_message: "${{ failure.message }}"
      transitions:
        - to: check_modules
          when: "jq(states.check_environment.outputs, '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true"
        - to: summarize
    check_modules:
      id: check_modules
      op: command_execution
      inputs:
        shell: bash
        working_directory: "${{ context.environment.op.worktree_path }}"
        timeout: 5m
        continue_on_error: true
        capture_diagnostics: always
        env:
          GOPRIVATE: github.com/colony-2/*
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          OUTBOX: "${{ context.environment.op.outbox }}"
        run: |
          set -eu
          scratch=$(mktemp -d /tmp/c2j-verify.XXXXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch/tmp" GOCACHE="$scratch/go-build" GOMODCACHE="$scratch/go-mod"
          export GOPATH="$scratch/go" npm_config_cache="$scratch/npm" XDG_CACHE_HOME="$scratch/cache"
          mkdir -p "$TMPDIR" "$GOCACHE" "$GOMODCACHE" "$npm_config_cache" "$XDG_CACHE_HOME"
          exec > "$OUTBOX/modules.log" 2>&1
          make check-mod
          # The published server fixture has its own dependency, not a root pin upgrade.
          go -C cmd/c2j/testdata/input-history-server mod tidy -diff
      catch:
        - when: "failure.kind != 'cancellation'"
          continue:
            outputs:
              success: false
              exit_code: -1
              timed_out: "${{ failure.kind == 'timeout' }}"
              failure: "${{ failure }}"
              error_message: "${{ failure.message }}"
      transitions:
        - to: test_integration
    test_integration:
      id: test_integration
      op: command_execution
      inputs:
        shell: bash
        working_directory: "${{ context.environment.op.worktree_path }}"
        # Cold builds and serial gates precede the queued, two-package suite.
        # Allow that whole schedule to finish without weakening package deadlines.
        timeout: 120m
        continue_on_error: true
        capture_diagnostics: always
        env:
          GOPRIVATE: github.com/colony-2/*
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          # Real private dependency builds and arm64 readiness and offline correctness.
          C2J_TEST_REAL_PNPM: "1"
          C2J_REQUIRE_NATIVE_PNPM: "1"
          OUTBOX: "${{ context.environment.op.outbox }}"
        run: |
          set -eu
          scratch=$(mktemp -d /tmp/c2j-verify.XXXXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch/tmp" GOCACHE="$scratch/go-build" GOMODCACHE="$scratch/go-mod"
          export GOPATH="$scratch/go" npm_config_cache="$scratch/npm" XDG_CACHE_HOME="$scratch/cache"
          mkdir -p "$TMPDIR" "$GOCACHE" "$GOMODCACHE" "$npm_config_cache" "$XDG_CACHE_HOME"
          exec > "$OUTBOX/tests.log" 2>&1
          # Tests create their own embedded jobs; never inherit this live job's identity.
          # Preserve the scoped Git credential socket and tool/cache environment.
          for variable in ${!C2J_CURRENT_@} ${!C2J_CHILD_JOB_@} ${!C2J_WORKSPACE_@}; do
            unset "$variable"
          done
          unset C2J_JOBDB C2J_TENANT_ID C2J_OBJECT_OUTBOX C2J_TEST_SUBMIT_BINARY C2J_REQUIRE_EXECUTION_BASE_CATALOG
          export GOWORK=off
          # Native retained history must pass through the built CLI and live helper.
          go build -mod=readonly -o "$scratch/c2j-input-history" ./cmd/c2j
          export C2J_TEST_INPUT_HISTORY_BINARY="$scratch/c2j-input-history"
          input_history_status=0
          go test -mod=readonly -count=1 -json -tags=integration -timeout=10m ./pkg/jobinputs ./pkg/input ./pkg/input/historybridge ./pkg/executionruntime ./pkg/childbroker ./cmd/c2j/internal/cmd ./cmd/c2j/internal/runjob ./pkg/recipetest ./cmd/c2j -run '^(TestHistory|TestInputHistory)' > "$scratch/input-history.json" || input_history_status=$?
          cat "$scratch/input-history.json"
          node - "$scratch/input-history.json" <<'JS'
          const fs = require('node:fs');
          const events = fs.readFileSync(process.argv[2], 'utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          const required = {
            'pkg/jobinputs': ['TestInputHistoryProtocol', 'TestInputHistoryVerifiedBytes', 'TestInputHistoryBlockedCancellation'],
            'pkg/input': ['TestHistorySQLiteRetainedWaitSnapshotsAndProducerBytes'],
            'pkg/input/historybridge': ['TestInputHistoryAdapterSnapshotsAndAuthority', 'TestInputHistoryPrivateRestoreFailures', 'TestInputHistoryConcurrentReaderIsolation'],
            'pkg/executionruntime': ['TestInputHistoryLeaseLifetime', 'TestInputHistoryRenewalPreservesAuthority', 'TestInputHistoryActiveTaskCancellation', 'TestInputHistoryCachedOperationsLifetime'],
            'pkg/childbroker': ['TestInputHistoryHelperAuthenticationAndClaims', 'TestInputHistoryHelperFinalAuthority', 'TestInputHistoryHelperTransport', 'TestInputHistoryHelperExpiredLifetimeBeforeDispatch', 'TestInputHistoryHelperExpiredLifetimeBeforeDispatch/request-canceled/list', 'TestInputHistoryHelperExpiredLifetimeBeforeDispatch/request-canceled/show', 'TestInputHistoryHelperExpiredLifetimeBeforeDispatch/request-canceled/artifact'],
            'cmd/c2j/internal/cmd': ['TestInputHistoryAtomicFiles', 'TestInputHistoryCLIValidation'],
            'cmd/c2j/internal/runjob': ['TestInputHistoryRunnerComposition'],
            'pkg/recipetest': ['TestInputHistoryRecipeTestComposition'],
            'cmd/c2j': ['TestInputHistoryCLIProcessRetainedRecords', 'TestInputHistoryCLIProcessTransport', 'TestInputHistoryCLIProcessAuthorityBeforeCompletion', 'TestInputHistoryCLIProcessRemoteOrigin', 'TestInputHistoryCLIProcessRetainedRecords/published-http', 'TestInputHistoryCLIProcessRemoteOrigin/denied', 'TestInputHistoryCLIProcessRemoteOrigin/wrapped-denied', 'TestInputHistoryCLIProcessRemoteOrigin/producer-denied', 'TestInputHistoryCLIProcessRemoteOrigin/producer-open-denied', 'TestInputHistoryCLIProcessRemoteOrigin/short', 'TestInputHistoryCLIProcessRemoteOrigin/legacy-server-denial']
          };
          for (const [suffix, names] of Object.entries(required)) {
            const pkg = 'github.com/colony-2/c2j/' + suffix;
            for (const name of names) {
              const rows = events.filter(e => e.Package === pkg && (e.Test === name || (e.Test || '').startsWith(name + '/')));
              if (!rows.some(e => e.Test === name && e.Action === 'pass') || rows.some(e => e.Action === 'skip' || e.Action === 'fail')) {
                throw new Error('Retained input history acceptance missing, skipped or failed: ' + pkg + '/' + name);
              }
            }
          }
          if (events.some(e => /^(TestHistory|TestInputHistory)/.test(e.Test || '') && (e.Action === 'skip' || e.Action === 'fail'))) {
            throw new Error('Retained input history required coverage failed or skipped');
          }
          JS
          test "$input_history_status" -eq 0
          go test -race -mod=readonly -count=1 -timeout=10m ./pkg/jobinputs ./pkg/input/historybridge ./pkg/executionruntime ./pkg/childbroker -run '^TestInputHistory'
          unset C2J_TEST_INPUT_HISTORY_BINARY
          # Exact hidden-source restarts must pass through the lease-bound helper.
          go test -mod=readonly -count=1 -v -timeout=5m ./pkg/executionruntime -run '^TestLeaseBoundRestartHelperSubmission$'
          # Saved-diff transport must preserve existing artifact-read diagnostics.
          go test -mod=readonly -count=1 -v -timeout=5m ./pkg/executionruntime -run '^TestTaskInspectionUsesBackendReadPermissions$'
          # Keep helper and inspection first; probe task/lease transitions and prompt cancellation.
          go test -mod=readonly -race -count=1 -v -timeout=10m ./cmd/c2j/internal/cmd ./cmd/c2j/internal/runjob ./pkg/task ./pkg/executionruntime ./pkg/worker/ops ./pkg/ops/extensions -run '^TestHealth|^TestPrompt'
          # Repeat cancellation, timeout and scheduler readiness regressions before the full suite.
          go test -mod=readonly -count=3 -v -tags=integration -timeout=5m ./pkg/childbroker ./pkg/worker/compiler ./pkg/executionruntime -run '^Test(JobInspectionExpiredLifetimeBeforeDispatch|MetricsHelperAuthenticationExactnessAndIncompleteHistory|ExtensionWaitManifestTimeout|InputHistoryHelperExpiredLifetimeBeforeDispatch|ExtensionWaitReadinessClockRecheck)$'
          # Extension waits must discard before publication and survive durable scheduling.
          # Record actual subtests; a successful command with no collected cases is insufficient.
          wait_status=0
          go test -mod=readonly -count=1 -json -tags=integration -timeout=10m ./pkg/extensionwait ./pkg/ops/extensions ./pkg/worker/ops ./pkg/metricsruntime ./pkg/secrets ./pkg/executionruntime ./pkg/worker/compiler ./pkg/childbroker -run '^TestExtensionWait' > "$scratch/extension-waits.jsonl" 2> "$scratch/extension-waits.stderr" || wait_status=$?
          cat "$scratch/extension-waits.jsonl"
          cat "$scratch/extension-waits.stderr"
          test "$wait_status" -eq 0
          node - "$scratch/extension-waits.jsonl" <<'JS'
          const fs = require('node:fs');
          const events = fs.readFileSync(process.argv[2], 'utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          for (const name of ['extensionwait', 'ops/extensions', 'worker/ops', 'metricsruntime', 'secrets', 'executionruntime', 'worker/compiler', 'childbroker']) {
            const pkg = 'github.com/colony-2/c2j/pkg/' + name;
            const tests = events.filter(e => e.Package === pkg && /^TestExtensionWait/.test(e.Test || ''));
            const runs = tests.filter(e => e.Action === 'run');
            if (!runs.length || runs.some(e => !tests.some(done => done.Test === e.Test && done.Action === 'pass')) || tests.some(e => e.Action === 'skip' || e.Action === 'fail')) {
              throw new Error('Extension wait acceptance missing, skipped or failed: ' + pkg);
            }
          }
          // Admission must reject satisfied bindings for different unfinished targets.
          for (const backend of ['toy', 'sqlite', 'remote']) {
            for (const target of ['job_target', 'goal_target']) {
              const test = 'TestExtensionWaitBindingAdmission/' + backend + '/' + target;
              const eventsForTest = events.filter(e => e.Package === 'github.com/colony-2/c2j/pkg/executionruntime' && e.Test === test);
              if (!eventsForTest.some(e => e.Action === 'run') || !eventsForTest.some(e => e.Action === 'pass')) {
                throw new Error('Extension wait binding acceptance missing: ' + test);
              }
            }
          }
          JS
          # Verify bounded Git descendant cleanup and diagnostic identity before broad checks.
          go test -mod=readonly -race -count=1 -v -tags=integration -timeout=5m ./pkg/jobinspect -run '^TestChanges(J30J32GitDiagnosticIdentity|J32L07GitProcessGroupCleanup|J30L07RepositoryTransferCleanup|ProcessExitObservation)$'
          # Expired inspection scopes must not enter storage while shutdown is pending.
          go test -mod=readonly -count=10 -v -timeout=2m ./pkg/childbroker -run '^(TestJobInspectionCancelledAdmission|TestMetricsHelperAuthenticationExactnessAndIncompleteHistory|TestJobInspectionAuthentication)$'
          # Process-group signals precede descendant exit; verify bounded cleanup observation.
          go test -mod=readonly -count=3 -v -timeout=3m ./pkg/jobinspect -run '^TestChanges(J30L07RepositoryTransferCleanup|J32L07GitProcessGroupCleanup|J30J32GitDiagnosticIdentity|J32L08CancelArrivingArtifact)$'
          # Real late-output functions must start before deadline/cancellation cleanup is exercised.
          go test -mod=readonly -count=3 -v -timeout=5m ./pkg/worker/compiler -run '^TestLateIncludeOutputProcessLifetime$'
          # Check native recovery and shell expectations against the same hook.
          go test -mod=readonly -count=1 -v -timeout=2m ./pkg/worker/compiler -run '^TestVerifyHook'
          # Validate this hook's native scenario contract before expensive suites.
          go test -mod=readonly -count=1 -v -timeout=5m ./pkg/recipetest -run '^TestPnpmVerifyHook$'
          # Require named catalog checks, actual CLI process exits and no skipped acceptance.
          export C2J_TEST_EXECUTION_BASES_BINARY="$scratch/c2j-input-history"
          go test -mod=readonly -count=1 -json -tags=integration -timeout=10m ./pkg/execution ./pkg/executioncatalog ./pkg/executionruntime ./pkg/gitprofile ./pkg/starter ./pkg/recipejob ./pkg/childbroker ./pkg/jobdbschema ./pkg/worker/compiler ./cmd/c2j/internal/cmd ./cmd/c2j/internal/runjob ./cmd/c2j/internal/submitjob ./cmd/c2j -run '^TestExecutionBaseCatalog' > "$scratch/execution-bases.json"
          cat "$scratch/execution-bases.json"
          node - "$scratch/execution-bases.json" <<'JS'
          const fs = require('node:fs');
          const events = fs.readFileSync(process.argv[2], 'utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          const required = {
            "pkg/execution": ["TestExecutionBaseCatalogSchema", "TestExecutionBaseCatalogMatching"],
            "pkg/executioncatalog": ["TestExecutionBaseCatalogFreshPolicy", "TestExecutionBaseCatalogCompletePolicy"],
            "pkg/executionruntime": ["TestExecutionBaseCatalogCompleteRuntime", "TestExecutionBaseCatalogCompleteCallbacks", "TestExecutionBaseCatalogRestoredDefaultsBeforeInstaller", "TestExecutionBaseCatalogFinalPublicationWithdrawalRestoresCandidate", "TestExecutionBaseCatalogFencesReadAgainstLeaseLoss"],
            "pkg/gitprofile": ["TestExecutionBaseCatalogScopedDiscoveryAndHiding", "TestExecutionBaseCatalogScopeFencesInflightDiscovery", "TestExecutionBaseCatalogForkFencesInflightDiscovery"],
            "pkg/starter": ["TestExecutionBaseCatalogPublicationAndPurePreparation", "TestExecutionBaseCatalogRestartInitialDemand", "TestExecutionBaseCatalogRestartCompleteRequirements", "TestExecutionBaseCatalogDisabledOCI"],
            "pkg/recipejob": ["TestExecutionBaseCatalogLibraryRequiredAndZeroPolicy", "TestExecutionBaseCatalogLibraryCompleteRequirements"],
            "pkg/childbroker": ["TestExecutionBaseCatalogOrdinaryAndSelectedBroker"],
            "pkg/jobdbschema": ["TestExecutionBaseCatalogSchemaRegistrationRechecksPublication", "TestExecutionBaseCatalogEnginePassThrough"],
            "pkg/worker/compiler": ["TestExecutionBaseCatalogSerializedFailure", "TestExecutionBaseCatalogExtensionNegotiationRefusal"],
            "cmd/c2j/internal/cmd": ["TestExecutionBaseCatalogFocusedEdits", "TestExecutionBaseCatalogConditionalPublication", "TestExecutionBaseCatalogObservedSnapshotConflict", "TestExecutionBaseCatalogMutationSnapshotConflict", "TestExecutionBaseCatalogScopedCLIFormats"],
            "cmd/c2j/internal/runjob": ["TestExecutionBaseCatalogRequiredDriverAcquiredAndSupplied"],
            "cmd/c2j/internal/submitjob": ["TestExecutionBaseCatalogStandaloneSubmission"],
            "cmd/c2j": ["TestExecutionBaseCatalogCLIProcess", "TestExecutionBaseCatalogCLIProcess/E01_E02_focused_session", "TestExecutionBaseCatalogCLIProcess/E01_C13_helper_and_denials", "TestExecutionBaseCatalogCLIProcess/E01_unavailable_authority"]
          };
          for (const [suffix, names] of Object.entries(required)) {
            const pkg = 'github.com/colony-2/c2j/' + suffix;
            for (const name of names) {
              const rows = events.filter(e => e.Package === pkg && (e.Test === name || (e.Test || '').startsWith(name + '/')));
              if (!rows.some(e => e.Test === name && e.Action === 'run') || !rows.some(e => e.Test === name && e.Action === 'pass') || rows.some(e => e.Action === 'skip' || e.Action === 'fail')) {
                throw new Error('Execution base acceptance missing, skipped or failed: ' + pkg + '/' + name);
              }
            }
          }
          if (events.some(e => /^TestExecutionBaseCatalog/.test(e.Test || '') && (e.Action === 'skip' || e.Action === 'fail'))) {
            throw new Error('Execution base acceptance failed or skipped');
          }
          JS
          unset C2J_TEST_EXECUTION_BASES_BINARY
          # Submission text must be recorded while only declared fields reach recipes.
          # Upgrade disposable legacy submission copies before replay/restart.
          go test -mod=readonly -count=3 -v -timeout=2m ./pkg/worker/compiler -run '^TestRecipeSubmissionInputsHistoricalReplayAndRestart$'
          go test -mod=readonly -count=1 -v -timeout=10m ./pkg/recipe ./pkg/worker/compiler ./pkg/recipejob ./pkg/recipetest ./pkg/childbroker ./pkg/starter ./cmd/c2j/internal/submitjob -run '^TestRecipeSubmissionInputs|^TestSelectedBrokerRealDispatchAndReplay$|^TestExplicitTitle(Selection|TransportAndDescriptor)$|^TestSubmissionPrompt|^Test(Title|LoadInputs)'
          # Fail early on compact failure formatting, persisted messages and real CLI output.
          # Keep named command outcomes visible across repeated success/continue cases.
          go test -mod=readonly -count=25 -v -timeout=60s ./pkg/worker/commandop -run '^TestCommandDiagnosticsDoNotChangeSuccessOrContinue$'
          go test -count=1 -v -timeout=10m ./pkg/ops/executiondiag ./pkg/ops/process ./pkg/recipe ./pkg/worker/commandop ./pkg/ops/extensions ./pkg/worker/ops ./pkg/worker/compiler ./cmd/c2j -run 'Test(Compact|ExecutionFailurePresentation|Capture|ExecuteProcessMasksDynamicallyResolvedGitCredentials|CommandCompact|CommandFailure|CommandDiagnostic|ExtensionCompact|ExtensionAutomatic|ExtensionCancellation|ExtensionCollectionFailure|ExtensionResultFailureReasons|ExecutionRequired|PreparedCompletion|CommandDiagnosticsNestedCatchResumeAndReplay|ExtensionExecutionLogCatchAndReplay|TaskWorkerCompact|WithLeaseCLIErrorOutput|VerifyHook)'
          # Exercise stamped run modes and lease diagnostics before the broad suite.
          go test -mod=readonly -count=1 -v -tags=integration -timeout=10m ./cmd/c2j -run '^Test(ReleaseBuildRecordsConsumerVersions|WithLeaseCLIErrorOutput)$'
          # Preserve tool output through submit --run and both child-recipe fixture engines.
          go test -count=1 -v -tags=integration -timeout=10m ./cmd/c2j/internal/submitjob ./pkg/input/test-fixtures -run '^Test(Run_EmbedExtensionFailureCompletesWithOriginalError|RecipeFixtures)'
          # Gate direct-file subprocess acceptance and enclosing-schema conflicts (source/mocked Nix).
          go test -mod=readonly -count=1 -v -timeout=10m ./pkg/artifacts ./pkg/ops/extensions ./pkg/worker/ops ./pkg/worker/compiler -run '^TestArtifactFile|^TestNixOpDescriptionDoesNotInstall$'
          # A Docker skip is recorded as unavailable packaged coverage in summary.md.
          go test -mod=readonly -count=1 -v -timeout=12m ./pkg/worker/compiler -run '^TestRealNixArtifactFiles$'
          # Exercise broker-only process routing before the broader integration suite.
          go test -mod=readonly -count=1 -v -timeout=10m ./pkg/childbroker -run '^TestBrokerOnlyCLI'
          # Selected successors honor atomic goal admission and exact receipt replay.
          go test -mod=readonly -count=1 -v -timeout=10m ./pkg/childbroker ./cmd/c2j/internal/submitjob ./pkg/recipejob -run '^(TestSelectedBroker|TestSelectedCLI|TestSelectedGoal)'
          # Imported scripts must enter the initial Git tree with their execute
          # bits intact, then run without permission repairs or new commits.
          go test -count=1 -v -timeout=5m ./pkg/recipetest ./cmd/c2j/internal/testjob -run '^Test(FixtureSource|NativeRuntimeFixtureSourceModes)'
          go test -mod=readonly -count=1 -v -timeout=5m ./cmd/c2j/internal/submitjob -run '^TestSubmission'
          # Lease parentage must pass real runtime, CLI and worker checks without skips.
          go build -mod=readonly -o "$scratch/c2j-parentage" ./cmd/c2j
          export C2J_TEST_SUBMIT_BINARY="$scratch/c2j-parentage"
          go test -mod=readonly -count=1 -json -tags=integration -timeout=10m ./cmd/c2j/internal/submitjob ./pkg/childbroker ./pkg/executionruntime ./pkg/worker/compiler ./cmd/c2j/internal/cmd -run '^(TestLeaseParentage|TestSubmissionRoute|TestSubmissionWaitBrokerLeaseRoutes|TestBrokerOnlyCLI|TestSelectedCLI|TestSelectedBroker|TestWorkerBrokerSubmitsIncomingAndLiveWorkspace|TestRun_BrokerSubmissionAndConfiguredImmediateExecution|TestSubmitHelp)' > "$scratch/parentage.json"
          cat "$scratch/parentage.json"
          node - "$scratch/parentage.json" <<'JS'
          const fs = require('node:fs');
          const events = fs.readFileSync(process.argv[2], 'utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          const required = {
            'cmd/c2j/internal/submitjob': ['TestLeaseParentageMissingBroker', 'TestLeaseParentageStandalone', 'TestLeaseParentageBrokerBoundaries', 'TestSubmissionWaitBrokerLeaseRoutes', 'TestRun_BrokerSubmissionAndConfiguredImmediateExecution'],
            'pkg/childbroker': ['TestBrokerOnlyCLI', 'TestLeaseParentageLostOrdinaryResponse'],
            'pkg/executionruntime': ['TestLeaseParentageSuppliedLease'],
            'pkg/worker/compiler': ['TestLeaseParentageWorkerCLI', 'TestWorkerBrokerSubmitsIncomingAndLiveWorkspace'],
            'cmd/c2j/internal/cmd': ['TestSubmitHelpPromotesConventions']
          };
          for (const [suffix, names] of Object.entries(required)) {
            const pkg = 'github.com/colony-2/c2j/' + suffix;
            for (const name of names) {
              const rows = events.filter(e => e.Package === pkg && (e.Test === name || (e.Test || '').startsWith(name + '/')));
              if (!rows.some(e => e.Test === name && e.Action === 'pass') || rows.some(e => e.Action === 'skip' || e.Action === 'fail')) {
                throw new Error('Lease parentage acceptance missing, skipped or failed: ' + pkg + '/' + name);
              }
            }
          }
          JS
          unset C2J_TEST_SUBMIT_BINARY
          # Fail early on literal Nix JSON compatibility and native activation.
          # Docker regressions retain their normal optional coverage; adopted
          # Ubuntu cold/warm acceptance runs separately with no skipped probes.
          go test -count=1 -v -timeout=10m ./internal/pathutil ./internal/portability ./pkg/shellcmd ./pkg/toolenv
          go test -count=1 -v -timeout=10m ./pkg/worker/compiler -run '^TestRealRepositoryNativePackages$'
          # Validate every unchanged c2ops declaration and native activation on
          # this Linux aarch64 allocation, including manager-free warm reuse.
          # Disposable signed-cache regressions above still require Docker;
          # this host check cannot establish their cold-store acceptance.
          C2J_TEST_C2OPS_LOCAL=1 go test -count=1 -v -timeout=15m ./pkg/toolenv -run '^TestRealC2opsEnvironment$'
          # Saved comparisons must execute assertions on every public surface.
          saved_diff_status=0
          go test -mod=readonly -count=1 -json -tags=integration -timeout=10m ./pkg/jobinspect ./pkg/childbroker ./cmd/c2j/internal/cmd ./cmd/c2j ./pkg/worker/compiler -run '^(TestWorkspaceDiff|ExampleWorkspaceDiff)' > "$scratch/saved-diff.json" || saved_diff_status=$?
          cat "$scratch/saved-diff.json"
          node - "$scratch/saved-diff.json" <<'JS'
          const fs = require('node:fs');
          const events = fs.readFileSync(process.argv[2], 'utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          const packages = {
            'pkg/jobinspect': /^TestWorkspaceDiffNative/,
            'pkg/childbroker': /^TestWorkspaceDiffHelper/,
            'cmd/c2j/internal/cmd': /^TestWorkspaceDiffCLI_/,
            'cmd/c2j': /^TestWorkspaceDiffCLIProcess/,
            'pkg/worker/compiler': /^TestWorkspaceDiffCompiler/
          };
          for (const [name, native] of Object.entries(packages)) {
            const pkg = 'github.com/colony-2/c2j/' + name;
            const tests = events.filter(e => e.Package === pkg && /^(TestWorkspaceDiff|ExampleWorkspaceDiff)/.test(e.Test || ''));
            const runs = tests.filter(e => e.Action === 'run');
            if (!runs.some(e => native.test(e.Test)) || runs.some(e => !tests.some(done => done.Test === e.Test && done.Action === 'pass')) || tests.some(e => e.Action === 'skip' || e.Action === 'fail')) {
              throw new Error('Saved workspace-diff acceptance missing, skipped or failed: ' + pkg);
            }
          }
          // Require named recovery and review repairs even if selectors change.
          const regressions = {
            'pkg/jobinspect': ['TestWorkspaceDiffPatchlessObserverEvidence', 'TestWorkspaceDiffNativePatchlessObservers', 'TestWorkspaceDiffNativePatchlessObserverRejections', 'TestWorkspaceDiffNativePatchlessObserverSources', 'TestWorkspaceDiffNativePatchlessObserverAttemptsAndCutoffs'],
            'pkg/worker/compiler': ['TestWorkspaceDiffCompilerReviewScopeWorkspace', 'TestWorkspaceDiffCompilerReviewFailedScope'],
            'pkg/childbroker': ['TestWorkspaceDiffHelperReviewResponseContract']
          };
          for (const [name, required] of Object.entries(regressions)) {
            for (const test of required) {
              if (!events.some(e => e.Package === 'github.com/colony-2/c2j/' + name && e.Test === test && e.Action === 'pass')) {
                throw new Error('Saved workspace-diff review regression missing: ' + test);
              }
            }
          }
          for (const backend of ['SQLite', 'HTTP']) {
            for (const variant of ['omitted-parent', 'parent-present']) {
              for (const selection of ['producer', 'observer-one', 'observer-two', 'latest']) {
                const test = `TestWorkspaceDiffNativePatchlessObservers/${backend}/${variant}/${selection}`;
                if (!events.some(e => e.Package === 'github.com/colony-2/c2j/pkg/jobinspect' && e.Test === test && e.Action === 'pass')) {
                  throw new Error('Patchless observer recovery missing: ' + test);
                }
              }
            }
          }
          JS
          test "$saved_diff_status" -eq 0
          # Inventory actual consumer method sets, including integration fixtures.
          go test -count=1 -v -timeout=10m ./internal/retirementcheck
          # Fail early on registered squash recovery and fresh persisted refreshes.
          go test -mod=readonly -count=1 -v -timeout=3m ./pkg/git/squashrebasemerge ./pkg/worker/compiler -run '^TestStandaloneSquash'
          # Fail early on the real shallow-transport restore/persistence regression.
          go test -count=1 -v -timeout=2m ./pkg/git/gitstate -run '^TestRestore_MatchingHEADShallowBase'
          # Native scenario acceptance includes fresh workers and the built CLI.
          # Includes late-bound dispatch prohibitions and native admission targets.
          go test -race ./pkg/recipetest -run '^TestScenario' -count=1 -timeout=20m
          go build -o "$scratch/c2j" ./cmd/c2j
          "$scratch/c2j" test validate --file testdata/repros/fixture-source-modes/modes.test.yaml
          "$scratch/c2j" test run --file testdata/repros/fixture-source-modes/modes.test.yaml --out-dir "$scratch/fixture-source-modes"
          for suite in admission-ordering advancement cancellation worker-recovery standalone-squash-history; do
            fixture="pkg/recipetest/testdata/native-scenarios/$suite.test.json"
            case_timeout=90s
            if [ "$suite" = standalone-squash-history ]; then
              case_timeout=3m
              export GIT_TEMPLATE_DIR="$PWD/pkg/recipetest/testdata/native-scenarios/standalone-squash-template"
            fi
            "$scratch/c2j" test validate --file "$fixture"
            "$scratch/c2j" test run --file "$fixture" --parallelism 1 --case-timeout "$case_timeout" --out-dir "$scratch/native-$suite"
            unset GIT_TEMPLATE_DIR
          done
          # Fail early if an incompatible worker can destroy resumable jobs or
          # lose bounded diagnostics. Use the same tests for acquired/supplied leases.
          go test -count=1 -v -timeout=2m ./cmd/c2j/internal/runjob ./pkg/worker/compiler ./pkg/objects ./pkg/worker/ops -run '^(TestReplayWrongWorker|TestExecutionDiagnostic|TestInfrastructure|TestCheckpointInfrastructure|TestInvocationInfrastructure)'
          # Keep cancelled grouped reads and definite append rejections distinct
          # from infrastructure failures when adopting the JobDB preservation fix.
          go test -count=1 -v -timeout=2m ./pkg/worker/compiler -run '^TestGrouping(SuccessorWaitsAndNoWriteLease|BackendRejectionsNeverFallBack|TransportFailureDoesNotResubmit)$'
          # Retained-goal adoption, explicit legacy-copy migration and optional inbox reads.
          go test -mod=readonly -count=1 -v -tags=integration -timeout=5m ./internal/consumerfixture ./internal/localruntime ./pkg/executionruntime ./pkg/input ./pkg/joblist ./pkg/story ./pkg/story/live ./pkg/story/internal/service ./pkg/worker/compiler -run '^(TestC05RetainedServerCapabilities|TestSelectedSubmissionUsesTrustedLocalAdministrator|TestDAGPersistedSubmissionRelationships|TestHistorySQLiteCompilerLineage|TestIncludeHiddenSQLiteHTTP|TestInbox|TestStoryServicePreservesReconstructionErrorCauses|TestStoryReplay|TestRestartContinuesGoalAndReconcilesAfterWinning|TestGoalBrokerRestartReceiptReplay|TestRestartPreFix|TestResumePreFix|TestRestartContextUnfinishedHistory|TestHistoricalGoalIdentityExecutionRestartAndReplay|TestHookAbsentLegacy)'
          # Bound concurrent fixture work; JSON streams progress from every package
          # immediately, retaining the active test if the command is interrupted.
          # The compiler's many serial cases can exhaust 20m in aggregate;
          # retain every case's own execution deadline.
          go test -count=1 -json -tags=integration -p 2 -timeout=30m ./...
          # Check the linked CLI as well as its packages: submissions must expose
          # every supported wait option in the executable being reviewed.
          go build -buildvcs=false -o "$scratch/c2j" ./cmd/c2j
          "$scratch/c2j" submit --help > "$scratch/submit-help.txt"
          for flag in --wait-job --wait-job-success --wait-goal --wait-until; do
            grep -q -- "$flag " "$scratch/submit-help.txt"
          done
          cat "$scratch/submit-help.txt"
      catch:
        - when: "failure.kind != 'cancellation'"
          continue:
            outputs:
              success: false
              exit_code: -1
              timed_out: "${{ failure.kind == 'timeout' }}"
              failure: "${{ failure }}"
              error_message: "${{ failure.message }}"
      transitions:
        - to: check_skills
    check_skills:
      id: check_skills
      op: command_execution
      inputs:
        shell: bash
        working_directory: "${{ context.environment.op.worktree_path }}"
        timeout: 5m
        continue_on_error: true
        capture_diagnostics: always
        env:
          GOPRIVATE: github.com/colony-2/*
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          OUTBOX: "${{ context.environment.op.outbox }}"
        run: |
          set -eu
          scratch=$(mktemp -d /tmp/c2j-verify.XXXXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch/tmp" GOCACHE="$scratch/go-build" GOMODCACHE="$scratch/go-mod"
          export GOPATH="$scratch/go" npm_config_cache="$scratch/npm" XDG_CACHE_HOME="$scratch/cache"
          mkdir -p "$TMPDIR" "$GOCACHE" "$GOMODCACHE" "$npm_config_cache" "$XDG_CACHE_HOME"
          exec > "$OUTBOX/skills.log" 2>&1
          npx -y skills add . --list --full-depth
      catch:
        - when: "failure.kind != 'cancellation'"
          continue:
            outputs:
              success: false
              exit_code: -1
              timed_out: "${{ failure.kind == 'timeout' }}"
              failure: "${{ failure }}"
              error_message: "${{ failure.message }}"
      transitions:
        - to: summarize
    summarize:
      id: summarize
      op: command_execution
      artifacts:
        ./ : "${{ jq([(has(states.check_environment) ? states.check_environment.artifacts : {}), (has(states.check_modules) ? states.check_modules.artifacts : {}), (has(states.test_integration) ? states.test_integration.artifacts : {}), (has(states.check_skills) ? states.check_skills.artifacts : {})], 'add | with_entries(select(.key == \"environment.log\" or .key == \"modules.log\" or .key == \"tests.log\" or .key == \"skills.log\"))') }}"
      inputs:
        shell: bash
        working_directory: "${{ context.environment.op.worktree_path }}"
        timeout: 2m
        capture_diagnostics: always
        env:
          INBOX: "${{ context.environment.op.inbox }}"
          OUTBOX: "${{ context.environment.op.outbox }}"
          CANDIDATE: "${{ inputs.candidate }}"
          BASE: "${{ inputs.base }}"
          VERDICT: "${{ (inputs.api_version == 'c2.build-hook/v1' && jq((has(states.check_environment) ? states.check_environment.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true && 'environment.log' in (has(states.check_environment) ? states.check_environment.artifacts : {}) && jq((has(states.check_modules) ? states.check_modules.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true && 'modules.log' in (has(states.check_modules) ? states.check_modules.artifacts : {}) && jq((has(states.test_integration) ? states.test_integration.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true && 'tests.log' in (has(states.test_integration) ? states.test_integration.artifacts : {}) && jq((has(states.check_skills) ? states.check_skills.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true && 'skills.log' in (has(states.check_skills) ? states.check_skills.artifacts : {})) ? 'passed' : 'failed' }}"
          RESULT_0: "${{ (jq((has(states.check_environment) ? states.check_environment.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true) ? 'passed' : 'failed' }}"
          DETAIL_0: "${{ json_stringify((has(states.check_environment) ? states.check_environment.outputs : {})) }}"
          RESULT_1: "${{ !(jq((has(states.check_environment) ? states.check_environment.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true) ? 'not run (environment gate failed)' : ((jq((has(states.check_modules) ? states.check_modules.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true) ? 'passed' : 'failed') }}"
          DETAIL_1: "${{ json_stringify((has(states.check_modules) ? states.check_modules.outputs : {})) }}"
          RESULT_2: "${{ !(jq((has(states.check_environment) ? states.check_environment.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true) ? 'not run (environment gate failed)' : ((jq((has(states.test_integration) ? states.test_integration.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true) ? 'passed' : 'failed') }}"
          DETAIL_2: "${{ json_stringify((has(states.test_integration) ? states.test_integration.outputs : {})) }}"
          RESULT_3: "${{ !(jq((has(states.check_environment) ? states.check_environment.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true) ? 'not run (environment gate failed)' : ((jq((has(states.check_skills) ? states.check_skills.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true) ? 'passed' : 'failed') }}"
          DETAIL_3: "${{ json_stringify((has(states.check_skills) ? states.check_skills.outputs : {})) }}"
        run: |
          set -eu
          report="$OUTBOX/summary.md"
          {
            printf '# Local candidate verification: %s\n\n' "$VERDICT"
            printf 'Candidate: %s\n\nBase: %s\n\n' "$CANDIDATE" "$BASE"
            printf 'Platform: '; uname -s -m || true
            printf '\nThis run covers this host only. It does not certify the GitHub matrix.\n'
            printf '\n## check_environment: %s\n\n' "$RESULT_0"
            printf 'Operation result (exit code, timeout, error):\n\n```json\n%s\n```\n' "$DETAIL_0"
            if [ -f "$INBOX/environment.log" ]; then
              printf '\nEvidence: environment.log\n'
            else
              printf '\nEvidence unavailable: environment.log (not run, launch failure, or export failure).\n'
            fi
            printf '\n## check_modules: %s\n\n' "$RESULT_1"
            printf 'Operation result (exit code, timeout, error):\n\n```json\n%s\n```\n' "$DETAIL_1"
            if [ -f "$INBOX/modules.log" ]; then
              printf '\nEvidence: modules.log\n'
            else
              printf '\nEvidence unavailable: modules.log (not run, launch failure, or export failure).\n'
            fi
            printf '\n## test_integration: %s\n\n' "$RESULT_2"
            printf 'Operation result (exit code, timeout, error):\n\n```json\n%s\n```\n' "$DETAIL_2"
            if [ -f "$INBOX/tests.log" ]; then
              printf '\nEvidence: tests.log\n'
            else
              printf '\nEvidence unavailable: tests.log (not run, launch failure, or export failure).\n'
            fi
            printf '\n## check_skills: %s\n\n' "$RESULT_3"
            printf 'Operation result (exit code, timeout, error):\n\n```json\n%s\n```\n' "$DETAIL_3"
            if [ -f "$INBOX/skills.log" ]; then
              printf '\nEvidence: skills.log\n'
            else
              printf '\nEvidence unavailable: skills.log (not run, launch failure, or export failure).\n'
            fi
            printf '\n## Observed environment and tool versions\n\n```text\n'
            if [ -f "$INBOX/environment.log" ]; then cat "$INBOX/environment.log"; fi
            printf '\n```\n\n## Observed test skips\n\n'
            if [ -f "$INBOX/tests.log" ]; then
              if ! grep -E -- '--- SKIP:|SKIP|[Ss]kipping' "$INBOX/tests.log"; then
                printf 'No skip markers observed in tests.log.\n'
              fi
            else
              printf 'Test evidence unavailable; skip coverage unknown.\n'
            fi
          } > "$report"
          test -s "$report"
          printf 'Local verification %s on %s/%s; environment=%s, modules=%s, integration=%s, skills=%s. See summary.md and per-check logs for tool versions, errors and observed skips.' \
            "$VERDICT" "$(uname -s)" "$(uname -m)" "$RESULT_0" "$RESULT_1" "$RESULT_2" "$RESULT_3"
outputs:
  api_version: c2.build-hook/v1
  status: "${{ (inputs.api_version == 'c2.build-hook/v1' && jq((has(states.check_environment) ? states.check_environment.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true && 'environment.log' in (has(states.check_environment) ? states.check_environment.artifacts : {}) && jq((has(states.check_modules) ? states.check_modules.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true && 'modules.log' in (has(states.check_modules) ? states.check_modules.artifacts : {}) && jq((has(states.test_integration) ? states.test_integration.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true && 'tests.log' in (has(states.test_integration) ? states.test_integration.artifacts : {}) && jq((has(states.check_skills) ? states.check_skills.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true && 'skills.log' in (has(states.check_skills) ? states.check_skills.artifacts : {}) && jq((has(states.summarize) ? states.summarize.outputs : {}), '.success == true and .exit_code == 0 and .timed_out == false and ((.diagnostic_errors // []) | length == 0)') == true && 'summary.md' in (has(states.summarize) ? states.summarize.artifacts : {}) && size((has(states.summarize) ? states.summarize.outputs : {}).stdout) > 0 && size((has(states.summarize) ? states.summarize.outputs : {}).stdout) <= 8192) ? 'passed' : 'failed' }}"
  summary: "${{ size((has(states.summarize) ? states.summarize.outputs : {}).stdout) > 0 && size((has(states.summarize) ? states.summarize.outputs : {}).stdout) <= 8192 ? (has(states.summarize) ? states.summarize.outputs : {}).stdout : 'Local verification failed: reporting output unavailable; inspect task diagnostics.' }}"
  artifact_refs: "${{ jq([jq([(has(states.check_environment) ? states.check_environment.artifacts : {}), (has(states.check_modules) ? states.check_modules.artifacts : {}), (has(states.test_integration) ? states.test_integration.artifacts : {}), (has(states.check_skills) ? states.check_skills.artifacts : {})], 'add | with_entries(select(.key == \"environment.log\" or .key == \"modules.log\" or .key == \"tests.log\" or .key == \"skills.log\"))'), jq((has(states.summarize) ? states.summarize.artifacts : {}), 'with_entries(select(.key == \"summary.md\"))')], 'add') }}"
