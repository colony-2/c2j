# c2j project config
#
# `base: go` derives:
# - self.repo via: go list -m -f '{{.Path}}'
# - dependents via: go list -m -f '{{if not .Main}}{{.Path}}{{end}}' all
base: go
self:
  cell: c2j
jobdb: http://192.168.1.195:9047/c2
root:
  repo: https://github.com/colony-2/c2-root.git
# Match the verify hook and CI toolchain exactly (approved package).
packages: ["nix:github:NixOS/nixpkgs/e4074f13905f5117d20ad71358596b41694863aa#go_1_26"]
# Derived current repo: github.com/colony-2/c2j
# Derived pattern: github.com/colony-2/${{ cell }}
# Derived root repo: github.com/colony-2/root
#
# Uncomment to override:
# pattern: 'github.com/colony-2/${{ cell }}'
# self:
#   repo: c2j
#   ref: main
# root:
#   repo: root
#   ref: main
# dependents:
#   filter: '^github\.com/colony-2/([A-Za-z0-9._-]+)$'
